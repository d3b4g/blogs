<!-- Back to Top Button -->
<button class="back-to-top" id="back-to-top" aria-label="Back to top">
    <span class="back-to-top-icon">↑</span>
</button>

<style>
    .back-to-top {
        position: fixed;
        bottom: 80px;
        right: 20px;
        width: 44px;
        height: 44px;
        background: #161b22;
        border: 1px solid #21262d;
        color: #8b949e;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: 998;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .back-to-top.visible {
        opacity: 1;
        visibility: visible;
    }

    .back-to-top:hover {
        background: #21262d;
        border-color: #00ff41;
        color: #00ff41;
        box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
    }

    .back-to-top-icon {
        font-size: 1.2rem;
        font-weight: bold;
        line-height: 1;
    }

    @media (max-width: 768px) {
        .back-to-top {
            bottom: 70px;
            right: 15px;
            width: 40px;
            height: 40px;
        }
    }
</style>

<script>
    (function () {
        const backToTop = document.getElementById('back-to-top');

        if (!backToTop) return;

        // Show/hide button based on scroll position
        window.addEventListener('scroll', function () {
            if (window.scrollY > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        // Scroll to top on click
        backToTop.addEventListener('click', function () {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    })();
</script>
