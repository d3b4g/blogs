<div class="sidebar-terminal">
  <!-- Terminal Header -->
  <div class="terminal-header">
    <span class="terminal-dot red"></span>
    <span class="terminal-dot yellow"></span>
    <span class="terminal-dot green"></span>
    <span class="terminal-title">~/nav</span>
  </div>

  <!-- Navigation Only -->
  <div class="sidebar-content">
    <nav class="sidebar-nav">
      <a href="{{ site.url }}{{ site.baseurl }}/" class="nav-link {% if page.url == '/' %}active{% endif %}">
        <span class="nav-prefix">├──</span>
        <span class="nav-icon">~</span>
        <span class="nav-text">home</span>
      </a>
      <a href="{{ site.url }}{{ site.baseurl }}/archive/"
        class="nav-link {% if page.url contains 'archive' %}active{% endif %}">
        <span class="nav-prefix">├──</span>
        <span class="nav-icon">></span>
        <span class="nav-text">archive</span>
      </a>
      <a href="{{ site.url }}{{ site.baseurl }}/categories/"
        class="nav-link {% if page.url contains 'categories' %}active{% endif %}">
        <span class="nav-prefix">├──</span>
        <span class="nav-icon">/</span>
        <span class="nav-text">categories</span>
        <span class="nav-count">[{{ site.categories | size }}]</span>
      </a>
      <a href="{{ site.url }}{{ site.baseurl }}/tags/"
        class="nav-link {% if page.url contains 'tags' %}active{% endif %}">
        <span class="nav-prefix">└──</span>
        <span class="nav-icon">#</span>
        <span class="nav-text">tags</span>
      </a>
    </nav>

    <div class="sidebar-social">
      {% if site.owner.twitter %}
      <a href="https://twitter.com/{{ site.owner.twitter }}" class="social-link" aria-label="Twitter">
        <i class="fa fa-twitter"></i>
      </a>
      {% endif %}
      {% if site.owner.github %}
      <a href="https://github.com/{{ site.owner.github }}" class="social-link" aria-label="GitHub">
        <i class="fa fa-github"></i>
      </a>
      {% endif %}
      {% if site.owner.linkedin %}
      <a href="https://linkedin.com/in/{{ site.owner.linkedin }}" class="social-link" aria-label="LinkedIn">
        <i class="fa fa-linkedin"></i>
      </a>
      {% endif %}
      {% if site.owner.email %}
      <a href="mailto:{{ site.owner.email }}" class="social-link" aria-label="Email">
        <i class="fa fa-envelope"></i>
      </a>
      {% endif %}
    </div>
  </div>
</div>
