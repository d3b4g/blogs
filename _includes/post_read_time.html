{% if post.content %}
  {% assign words = post.content | number_of_words %}
  {% if words < 360 %}
    <span class="read-time"><i class="fa fa-clock-o" aria-hidden="true"></i> 1 min read</span>
  {% else %}
    <span class="read-time"><i class="fa fa-clock-o" aria-hidden="true"></i> {{ words | divided_by:180 }} min read</span>
  {% endif %}
{% else %}
  <span class="read-time"><i class="fa fa-clock-o" aria-hidden="true"></i> 1 min read</span>
{% endif %}
